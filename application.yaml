# This is a global configuration file that applies to all Config-Server configurations.

# Eureka Config for all services
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

# Management, Actuator, and Micrometer Tracing Config
management:
  endpoints:
    web:
      exposure:
        include: "*"

management.tracing.sampling.probability: 1.0
spring.zipkin.baseUrl: http://localhost:9411

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
