# This is a global configuration file that applies to all Config-Server configurations.

#Eureka Config for all services
eureka:
  client:
    service-url.defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: "*"   # List specific endpoints to expose (use '*' for all)

# Tracing: Zipkin & Micrometer
  tracing:
    sampling:
      probability: 1.0 # Set the sampling rate (1.0 = 100%)
#    export:
#      zipkin:
#        endpoint: "http://localhost:9411/api/v2/spans"
