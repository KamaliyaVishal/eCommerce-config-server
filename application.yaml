# This is a global configuration file that applies to all Config-Server configurations.

# Eureka Config for all services
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

# Management, Actuator, and Micrometer Tracing Config
management:
  # 1. Enable 100% trace sampling
  tracing:
    sampling:
      probability: 1.0

  # 2. Point Micrometer to your Zipkin Server instance
  zipkin:
    tracing:
      endpoint: http://127.0.0.1:9411/zipkin/

  # 3. Actuator endpoint exposure
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"