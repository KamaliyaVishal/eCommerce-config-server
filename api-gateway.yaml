spring:
  cloud:
    gateway.server.webflux:
      routes:
        # Route 1: order-service
        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/order/**
          filters:
            - name: LoggingOrderFilter

        # Route 2: inventory-service
        - id: inventory-service
          uri: lb://INVENTORY-SERVICE
          predicates:
            - Path=/product/**